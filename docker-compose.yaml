services:
  llama-opencl:
    build: .
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "993"   # render group GID on this host
      - video
    environment:
      - RUSTICL_ENABLE=panfrost
    volumes:
      - .:/workspace                            # Entire project (includes .git/modules for submodule)
      - /lib/firmware:/lib/firmware:ro
      - /home/alex/.claude:/root/.claude        # Claude Code auth session
      - /home/alex/.ssh:/root/.ssh:ro           # SSH keys for git push
    stdin_open: true
    tty: true
